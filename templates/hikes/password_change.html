{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center mb-5">
    <div class="col-md-6">
        <h2>Change Password</h2>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary mt-3">Save new password</button>
        </form>
    </div>
</div>
{% endblock %}
