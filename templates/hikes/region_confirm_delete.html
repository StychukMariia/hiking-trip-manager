{% extends "base.html" %}

{% block content %}
  <h1>Delete region?</h1>
  <p>Are you sure you want to delete the region: {{ region.name }}?</p>
  <p><i>All expeditions with this region will be also deleted!</i></p>
  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="javascript:history.back()" class="btn btn-secondary ms-2">Cancel</a>
  </form>
{% endblock %}
